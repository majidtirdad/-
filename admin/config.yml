backend:
  name: github
  repo: majidtirdad/majidtirdadsite
  branch: main
  base_url: https://tirdadads.vercel.app
  auth_endpoint: api/auth

media_folder: "static/uploads"
public_folder: "/static/uploads"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "_projects"
    create: true
    delete: true
    slug: "{{slug}}"
    sortable_fields: ["order", "title_en"]
    summary: "{{title_en}} — {{category_en}}"
    fields:
      - label: "Order"
        name: "order"
        widget: "number"
        default: 99
        hint: "Display order — lower number = shown first"

      - label: "Title (EN)"
        name: "title_en"
        widget: "string"
        hint: "Project title in English"

      - label: "Title (FA)"
        name: "title_fa"
        widget: "string"
        hint: "عنوان پروژه به فارسی"

      - label: "Category (EN)"
        name: "category_en"
        widget: "string"
        required: false
        hint: "e.g. Commercial, Music Video, Brand Film"

      - label: "Category (FA)"
        name: "category_fa"
        widget: "string"
        required: false
        hint: "مثلاً تبلیغاتی، موزیک ویدیو"

      - label: "Description (EN)"
        name: "description_en"
        widget: "text"
        required: false

      - label: "Description (FA)"
        name: "description_fa"
        widget: "text"
        required: false

      - label: "Cover Image"
        name: "cover"
        widget: "image"
        hint: "Upload project cover image"

      - label: "Instagram Reel URL"
        name: "instagram_url"
        widget: "string"
        hint: "https://www.instagram.com/reel/..."
