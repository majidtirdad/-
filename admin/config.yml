backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/static/uploads"

locale: fa

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "_projects"
    create: true
    delete: true
    slug: "{{slug}}"
    sortable_fields: ["order", "title_en"]
    fields:
      - label: "Title (EN)"
        name: "title_en"
        widget: "string"
        hint: "Project title in English"

      - label: "Title (FA)"
        name: "title_fa"
        widget: "string"
        hint: "عنوان پروژه به فارسی"

      - label: "Category (EN)"
        name: "category_en"
        widget: "string"
        required: false
        hint: "e.g. Commercial, Music Video, Brand Film"

      - label: "Category (FA)"
        name: "category_fa"
        widget: "string"
        required: false
        hint: "مثلاً تبلیغاتی، موزیک ویدیو"

      - label: "Description (EN)"
        name: "description_en"
        widget: "text"
        required: false

      - label: "Description (FA)"
        name: "description_fa"
        widget: "text"
        required: false

      - label: "Cover Image"
        name: "cover"
        widget: "image"
        hint: "Upload cover image for the project card"

      - label: "Instagram Reel URL"
        name: "instagram_url"
        widget: "string"
        hint: "https://www.instagram.com/reel/..."

      - label: "Order"
        name: "order"
        widget: "number"
        default: 1
        hint: "Display order (lower = first)"
